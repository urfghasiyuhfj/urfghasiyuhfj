services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ppm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: fuqiuyang030828
      MYSQL_DATABASE: ppm_db
      MYSQL_USER: user
      MYSQL_PASSWORD: fuqiuyang030828
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./ppm-backend/sql/init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pfuqiuyang030828"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ppm-network

#  # RabbitMQ（可选）
#  rabbitmq:
#    image: rabbitmq:3-management-alpine
#    container_name: ppm-rabbitmq
#    restart: unless-stopped
#    environment:
#      RABBITMQ_DEFAULT_USER: admin
#      RABBITMQ_DEFAULT_PASS: fuqiuyang030828
#    volumes:
#      - rabbitmq_data:/var/lib/rabbitmq
#    ports:
#      - "5672:5672"
#      - "15672:15672"
#    networks:
#      - ppm-network

  # 后端服务
  ppm-backend:
    build:
      context: ./ppm-backend
      dockerfile: Dockerfile
    container_name: ppm-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ppm_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: fuqiuyang030828
      PPM_IMPORT_FOLDER: /data/import
    volumes:
      - ./data/import:/data/import
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ppm-network

  # 前端服务
  ppm-frontend:
    build:
      context: ./ppm-frontend
      dockerfile: Dockerfile
    container_name: ppm-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - ppm-backend
    networks:
      - ppm-network

