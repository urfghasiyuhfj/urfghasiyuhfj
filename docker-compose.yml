services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ppm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ppm_db}
      MYSQL_USER: ${MYSQL_USER:-ppm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./ppm-backend/sql/init_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ppm-network

#  # RabbitMQ（可选）
#  rabbitmq:
#    image: rabbitmq:3-management-alpine
#    container_name: ppm-rabbitmq
#    restart: unless-stopped
#    environment:
#      RABBITMQ_DEFAULT_USER: admin
#      RABBITMQ_DEFAULT_PASS: fuqiuyang030828
#    volumes:
#      - rabbitmq_data:/var/lib/rabbitmq
#    ports:
#      - "5672:5672"
#      - "15672:15672"
#    networks:
#      - ppm-network

  # 后端服务
  ppm-backend:
    build:
      context: ./ppm-backend
      dockerfile: Dockerfile
    container_name: ppm-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ppm_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ppm_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      PPM_IMPORT_FOLDER: ${PPM_IMPORT_FOLDER:-/data/import}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    volumes:
      - ./data/import:/data/import
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/v3/api-docs || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ppm-network

  # 前端服务
  ppm-frontend:
    build:
      context: ./ppm-frontend
      dockerfile: Dockerfile
    container_name: ppm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      ppm-backend:
        condition: service_healthy
    networks:
      - ppm-network

  # MQ服务（可选）
